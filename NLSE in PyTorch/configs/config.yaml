# XPM Identity Operator Training Configuration

# Simulation Parameters
simulation:
  Lz: 1e-3              # Propagation distance in km (1cm = 1e-5)
  Nz: 200               # Number of steps in z
  Lt: 16                 # Temporal window size
  Nt: 4096               # Number of temporal points
  N_modes: 500           # Number of HG modes

# Medium Parameters
medium:
  beta2_j: -10           # anomalous GVD region for wave j
  beta2_k: -10           # anomalous GVD region for wave k
  gamma_j: 1             # Nonlinearity parameter for wave j
  gamma_k: 1             # Nonlinearity parameter for wave k

# Pulse Parameters
pulse:
  tau: 0.1               # Temporal width of the pulse = 100 fs - also, characteristic time of Hermite-Gauss basis

# Training Parameters
training:
  batch_size: 16         # Number of modes to simulate (batch size)
  amplitude_downscale: 1e-1  # Downscaling factor for input amplitudes
  mask_percent: 0.8      # Size of the unpenalized region in percent of the total temporal window
  m: 8                   # Number of slices to check for penalty
  w_mse: 1.2e0             # MSE loss weight
  w_pen: 1e3             # Penalty loss weight
  lr: 5e-2               # Learning rate
